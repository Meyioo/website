<nav class="bg-gray-800 text-white py-4 px-6 flex fixed w-full z-10">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <!-- Desktop Navigation -->
    <ul class="hidden md:flex space-x-8">
      <li>
        <a
          (click)="scrollToSection('home')"
          class="hover:text-blue-300 transition-colors cursor-pointer"
          >Home</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('work-experience')"
          class="hover:text-blue-300 transition-colors cursor-pointer"
          >Work Experience</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('education')"
          class="hover:text-blue-300 transition-colors cursor-pointer"
          >Education</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('projects')"
          class="hover:text-blue-300 transition-colors cursor-pointer"
          >Projects</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('contact')"
          class="hover:text-blue-300 transition-colors cursor-pointer"
          >Contact</a
        >
      </li>
    </ul>

    <!-- Mobile Menu Button -->
    <button
      class="md:hidden text-white focus:outline-none focus:text-blue-300"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle mobile menu"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        @if (!isMobileMenuOpen) {
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
        } @else {
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
        }
      </svg>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <div
    class="md:hidden transition-all duration-300 ease-in-out overflow-hidden"
    [class.max-h-96]="isMobileMenuOpen"
    [class.max-h-0]="!isMobileMenuOpen"
  >
    <ul class="pt-4 pb-2 space-y-2">
      <li>
        <a
          (click)="scrollToSection('home'); closeMobileMenu()"
          class="block py-2 px-4 hover:bg-gray-700 hover:text-blue-300 transition-colors rounded cursor-pointer"
          >Home</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('work-experience'); closeMobileMenu()"
          class="block py-2 px-4 hover:bg-gray-700 hover:text-blue-300 transition-colors rounded cursor-pointer"
          >Work Experience</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('education'); closeMobileMenu()"
          class="block py-2 px-4 hover:bg-gray-700 hover:text-blue-300 transition-colors rounded cursor-pointer"
          >Education</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('projects'); closeMobileMenu()"
          class="block py-2 px-4 hover:bg-gray-700 hover:text-blue-300 transition-colors rounded cursor-pointer"
          >Projects</a
        >
      </li>
      <li>
        <a
          (click)="scrollToSection('contact'); closeMobileMenu()"
          class="block py-2 px-4 hover:bg-gray-700 hover:text-blue-300 transition-colors rounded cursor-pointer"
          >Contact</a
        >
      </li>
    </ul>
  </div>
</nav>
