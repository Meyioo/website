<div class="mb-16 flex">
  <!-- Year Label -->
  <app-year-label [year]="year"></app-year-label>

  <!-- Card -->
  <div
    class="bg-white shadow-lg rounded-lg p-8 max-w-xl"
    [class]="isRightAligned ? 'self-end' : 'self-start'"
  >
    <h3 class="text-2xl font-semibold mb-4 text-gray-800">
      {{ experience.title }}
    </h3>
    <p class="text-gray-600 mb-2">
      {{ experience.company }} &mdash; {{ experience.period }}
    </p>
    <ul class="list-disc list-inside text-gray-700 space-y-1">
      @for (responsibility of experience.responsibilities; track responsibility)
      {
      <li>{{ responsibility }}</li>
      }
    </ul>
  </div>
</div>
